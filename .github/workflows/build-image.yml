# Builds the wireguard image (WireGuard + wireguard-ui fork + Seafile) on every push to main
# and publishes it to GHCR as ghcr.io/<owner>/<repo>:latest (+ :sha-<commit>).
#
# The build definition is docker-compose.yaml itself: `buildx bake` reads the service's
# build context/args (WGUI_FORK_REF pin, SEAFILE_IMAGE) from there, so there is one source of
# truth. The compose file also interpolates runtime `environment:` entries, hence the dummy
# SEAFILE_* values below (they only satisfy the `${VAR:?}` checks; nothing is baked in).
#
# The server then runs: docker compose pull wireguard && docker compose up -d

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  WG_IMAGE: ghcr.io/${{ github.repository }}:latest
  SEAFILE_HOST: ci.invalid
  SEAFILE_DB_ROOT_PASSWORD: ci
  SEAFILE_ADMIN_PASSWORD: ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Merged into the compose service target, so tags/labels land on `wireguard`.
          bake-target: wireguard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ./docker-compose.yaml
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: wireguard
          push: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
