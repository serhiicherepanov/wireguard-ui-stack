# Optional overlay: Traefik reverse proxy + TLS (Let's Encrypt, HTTP-01) for Seafile and
# the UI, both on the wireguard container:
#   https://$SEAFILE_HOST/            -> Seafile (nginx :80)        [SEAFILE_HOST defaults to WG_HOST]
#   https://$WG_HOST$WGUI_BASE_PATH   -> wireguard-ui (:5000)       [BASE_PATH is process-wide]
# Usage: docker compose -f docker-compose.yaml -f docker-compose.traefik.yaml up -d

services:
  traefik:
    image: traefik:v3.6
    container_name: wg-traefik
    restart: always
    command:
      - "--ping=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--api.dashboard=true"

      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.unsecure.address=:80"
      - "--entrypoints.unsecure.http.redirections.entryPoint.to=default"
      - "--entrypoints.unsecure.http.redirections.entryPoint.scheme=https"

      - "--entrypoints.default.address=:443"
      - "--entrypoints.default.http.tls=true"

      # ACME via HTTP-01: port 80 must be reachable from the internet and DNS must point here.
      # Traefik serves /.well-known/acme-challenge/ on :80 before the HTTPS redirect kicks in.
      - "--certificatesresolvers.default.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.default.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.default.acme.httpchallenge=true"
      - "--certificatesresolvers.default.acme.httpchallenge.entrypoint=unsecure"
    # Host network: traefik binds :80/:443 directly, reaches containers via the bridge.
    network_mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefikapi.rule=PathPrefix(`/api/`) && HeadersRegexp(`Referer`, `^https?:\\/\\/.+\\/traefik\\/dashboard\\/`)"
      - "traefik.http.routers.traefikapi.entrypoints=default"
      - "traefik.http.routers.traefikapi.service=api@internal"
      - "traefik.http.routers.traefikapi.middlewares=traefik-auth"

      - "traefik.http.routers.traefikdashboard.rule=PathPrefix(`/traefik/dashboard/`)"
      - "traefik.http.routers.traefikdashboard.priority=500"
      - "traefik.http.routers.traefikdashboard.entrypoints=default"
      - "traefik.http.routers.traefikdashboard.service=api@internal"
      - "traefik.http.routers.traefikdashboard.middlewares=traefik-auth,traefik-stripprefix"

      - "traefik.http.middlewares.traefik-stripprefix.stripprefix.prefixes=/traefik"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}"
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping"]
      start_period: 5s
      interval: 5s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  wireguard:
    environment:
      # Passkeys (WebAuthn) need a fixed RP ID / origin behind the proxy.
      - WGUI_WEBAUTHN_RP_ID=${WG_HOST}
      - WGUI_WEBAUTHN_RP_ORIGINS=https://${WG_HOST}
      # TLS ends at Traefik: make Seafile write https:// URLs on first run.
      - FORCE_HTTPS_IN_CONF=true
    labels:
      - "traefik.enable=true"
      # UI under BASE_PATH. Explicit priority: it must win over the Seafile catch-all below
      # when both hosts are the same.
      - "traefik.http.routers.wg-ui.entrypoints=default"
      - "traefik.http.routers.wg-ui.rule=Host(`${WG_HOST}`) && PathPrefix(`${WGUI_BASE_PATH:-/wg}`)"
      - "traefik.http.routers.wg-ui.priority=100"
      - "traefik.http.routers.wg-ui.tls.certresolver=default"
      - "traefik.http.routers.wg-ui.service=wg-ui"
      - "traefik.http.services.wg-ui.loadbalancer.server.port=5000"

      # Seafile: everything else on its host (nginx inside the container, :80).
      - "traefik.http.routers.seafile.entrypoints=default"
      - "traefik.http.routers.seafile.rule=Host(`${SEAFILE_HOST:-${WG_HOST}}`)"
      - "traefik.http.routers.seafile.priority=10"
      - "traefik.http.routers.seafile.tls.certresolver=default"
      - "traefik.http.routers.seafile.service=seafile"
      - "traefik.http.services.seafile.loadbalancer.server.port=80"
