# Base stack: WireGuard + WireGuard-UI + ofelia. No reverse proxy.
# Add Traefik with:  docker compose -f docker-compose.yaml -f docker-compose.traefik.yaml up -d
# or set COMPOSE_FILE in .env (see .env.example).

services:
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Tbilisi}
      - SERVERURL=${WG_HOST}
      - SERVERPORT=${WG_PORT:-51821}
      # UI manages peers; keep 0
      - PEERS=0
      - INTERNAL_SUBNET=${WG_SUBNET:-10.13.13.0}
    volumes:
      - ./wireguard/config:/config
      - ./scripts:/scripts:ro
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "${WG_PORT:-51821}:${WG_PORT:-51821}/udp"
      # UI lives in this container's netns. Bound to localhost by default;
      # with the traefik override the proxy handles public access.
      - "${WGUI_BIND:-127.0.0.1}:${WGUI_PORT:-5000}:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 && ip link show wg0 >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      # ofelia: re-sync live wg0 with the conf written by the UI and add missing
      # kernel routes for peer AllowedIPs (see scripts/wg-sync.sh).
      - "ofelia.enabled=true"
      - "ofelia.job-exec.wg-sync.schedule=@every 1m"
      - "ofelia.job-exec.wg-sync.command=sh /scripts/wg-sync.sh"

  wireguard-ui:
    image: ngoduykhanh/wireguard-ui:latest
    container_name: wireguard-ui
    restart: always
    depends_on:
      wireguard:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Tbilisi}
      # linuxserver wg conf folder is mounted to /etc/wireguard
      - WIREGUARD_CONF_PATH=/etc/wireguard/wg0.conf
      - WGUI_DEFAULT_CLIENT_ALLOWED_IPS=${WGUI_DEFAULT_CLIENT_ALLOWED_IPS:-10.13.13.0/24}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_ALLOW_CONF_REQUEST=${TELEGRAM_ALLOW_CONF_REQUEST:-true}
      # Optional:
      # - SESSION_SECRET=${WGUI_SESSION_SECRET}
      # - WGUI_USERNAME=${WGUI_USERNAME}
      # - WGUI_PASSWORD=${WGUI_PASSWORD}
    volumes:
      - ./wireguard/config/wg_confs:/etc/wireguard
      - ./wireguard/ui/db:/app/db
    # Shares the network namespace with wireguard so it can manage wg0 directly.
    network_mode: "service:wireguard"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: always
    depends_on:
      - wireguard
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
